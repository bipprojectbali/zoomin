# Stack Portainer: LiveKit SFU untuk zoomin (tanpa subdomain, tanpa Traefik).
# Env stack (Portainer > Stacks > Environment variables): lihat deploy/livekit-stack.env.example.
# Panduan + firewall: deploy/README.md bagian "LiveKit via Portainer (tanpa subdomain)".
services:
  livekit:
    # Pin versi; sama dengan binary yang diverifikasi di repo (1.13.11).
    image: livekit/livekit-server:v1.13.11
    container_name: livekit
    restart: unless-stopped
    # Host network: WebRTC butuh range UDP 50000-60000; port mapping Docker untuk 10k port lambat & boros.
    # Konsekuensi: tidak ada `ports:`/`networks:`/label Traefik, port langsung terbuka di host -> atur firewall.
    network_mode: host
    cpus: "2.0"
    mem_limit: 2g
    mem_reservation: 512m
    pids_limit: 1024
    cpu_shares: 1024
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      # Dibaca livekit-server sebagai isi config (flag --config-body, sumber env LIVEKIT_CONFIG).
      # Bentuk map (bukan list seperti biasa) karena nilainya YAML multi-baris.
      LIVEKIT_CONFIG: |
        port: 7880
        # Hanya memengaruhi listener HTTP/signaling 7880 (bukan RTC/TURN). Default semua interface.
        bind_addresses:
          - "${LIVEKIT_BIND:-0.0.0.0}"
        log_level: info
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: true
        turn:
          enabled: true
          udp_port: 3478
        keys:
          "${LIVEKIT_API_KEY:?isi LIVEKIT_API_KEY di env stack}": "${LIVEKIT_API_SECRET:?isi LIVEKIT_API_SECRET di env stack}"
