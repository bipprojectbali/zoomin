# Plugin Tailwind untuk HTML import di Bun.serve (docs bun.com/docs/bundler/fullstack).
[serve.static]
plugins = ["bun-plugin-tailwind"]

[test]
# Test spike di RND/ punya dependency & server sendiri; e2e/ dijalankan Playwright (`bun run test:e2e`).
pathIgnorePatterns = ["RND/**", "node_modules/**", "e2e/**"]
